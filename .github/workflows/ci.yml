name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build + unit + live parity
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Live parity against the pinned donsetch release
        run: npm run live
        env:
          # The live test downloads the pinned release from GitHub
          # Releases and drives the real daemon over MCP.
          DONSETCH_DSH_AUTOUPDATE: off
      - name: Real-registry contract proof (apply into an actual dsh ToolRuntime)
        if: runner.os != 'Windows'
        run: |
          DONSETCH_BIN="$(node -e "import('./dist/binary.js').then(m => process.stdout.write(m.binaryAt(process.argv[1])))" "$(node -e "import('./dist/version.js').then(m => process.stdout.write(m.PINNED_DONSETCH_VERSION))")")"
          DONSETCH_BIN="$DONSETCH_BIN" node --test --test-concurrency=1 test/real-registry.test.mjs
        env:
          DONSETCH_DSH_AUTOUPDATE: off

  # A packed plugin must compose into a fresh profile in the real CLI.
  # Keep the host and package manager explicit; dsh does not bundle pnpm.
  dsh-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm pack
        shell: bash
      - name: Install the smoke-test host and package manager
        timeout-minutes: 15
        run: npm install --global @deepseek-ai/dsh@0.2.1-rc.5 pnpm@10.20.0 --no-audit --no-fund --loglevel=info
      - name: Install into a fresh DSH profile and verify the row
        timeout-minutes: 3
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}/donsetch-dsh-smoke
          CI: 'true'
        run: |
          $tgz = Get-ChildItem *.tgz | Select-Object -First 1
          dsh plugin --profile ci add (Resolve-Path $tgz.Name)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $config = dsh --profile ci --dump-config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($config -match 'name: [''"]?@dsh-external/donsetch')) {
            throw 'Packed plugin is missing from the composed profile'
          }
          $config | Select-String -Pattern '@dsh-external/donsetch|donsetch'
